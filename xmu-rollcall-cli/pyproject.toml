[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmu-assistant"
dynamic = ["version"]
description = "虾大助手 - Campus Assistant desktop client"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.31.0",
    "xmulogin>=1.0.0",
    "PySide6>=6.7.0",
    # Windows 凭据加密；不可用时拒绝覆盖原配置，禁止退回明文。
    "pywin32>=306; sys_platform == \"win32\"",
]

[project.optional-dependencies]
mcp = ["mcp==1.30.0", "pypdf==6.21.4"]
# pytest 9 自带 unittest.subTest 支持，不再需要 pytest-subtests 插件。
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
xmu-study-mcp = "xmu_rollcall.mcp_bridge.server:main"
xmu-dashboard = "xmu_rollcall.desktop_qt.app:main"

[tool.setuptools.packages.find]
# 必须自动发现并包含子包：此前 packages = ["xmu_rollcall"] 漏掉 desktop_qt 子包，
# pip install 产出的 wheel 不含全部 UI 文件，入口点 xmu-dashboard 直接
# ModuleNotFoundError（开发一直走 PYTHONPATH 从未暴露）。
include = ["xmu_rollcall*"]

[tool.setuptools.package-data]
# The wheel must retain the icon fallback used when the repository-level
# assets directory is absent after installation; data/ holds radar presets.
xmu_rollcall = ["assets/*.ico", "assets/*.png", "assets/file_icons/*.png", "assets/file_icons/*.txt", "assets/ui_indicators/*.png", "data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "xmu_rollcall.__version__"}
